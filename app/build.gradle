plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smpn1tualang.cbtexam'
    compileSdk 34

    defaultConfig {
        applicationId "com.smpn1tualang.cbtexam"
        minSdk 21 // Mendukung Android 5.0 Lollipop ke atas (sangat ringan)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Library ringan untuk Scan QR Code
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Library ringan untuk memuat logo dari URL
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
