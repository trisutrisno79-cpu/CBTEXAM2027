name: Build CBT Exam APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download App Icon from URL
      run: |
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        curl -sL "https://smpn1tualang.sch.id/images/aplikasi/logo.png" -o app/src/main/res/drawable/logo_sekolah.png
        cp app/src/main/res/drawable/logo_sekolah.png app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp app/src/main/res/drawable/logo_sekolah.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp app/src/main/res/drawable/logo_sekolah.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CBT-Exam-SMPN1Tualang-APK
        path: app/build/outputs/apk/debug/app-debug.apk
